version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dotnet_ecom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecom_admin
      POSTGRES_PASSWORD: ecom_password_123
      POSTGRES_DB: ecom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet_ecom_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: PostgreSql
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=ecom_db;Username=ecom_admin;Password=ecom_password_123"
      Stripe__SecretKey: "sk_test_placeholder"
      Stripe__WebhookSecret: "whsec_placeholder"
    ports:
      - "5000:8080"
    depends_on:
      - db

volumes:
  postgres_data:
